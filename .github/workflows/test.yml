name: Tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/WorkspaceTests.csproj -f net8.0
      - run: dotnet run --project tests/GitTests.csproj -f net8.0
      - run: dotnet run --project tests/InstallerTests.csproj
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  windows-git:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build tests/GitTests.csproj -f net48
      - run: ./tests/bin/GitTests/Debug/net48/GitTests.exe
      - run: dotnet build tests/WorkspaceTests.csproj -f net48
      - run: ./tests/bin/WorkspaceTests/Debug/net48/WorkspaceTests.exe
      - run: dotnet build tests/SyncDialogTests.csproj
      - run: ./tests/bin/SyncDialogTests/Debug/net48/SyncDialogTests.exe
      - run: dotnet build tests/ProjectContextTests.csproj
      - run: ./tests/bin/ProjectContextTests/Debug/net48/ProjectContextTests.exe
      - run: dotnet build tests/GitResponsiveness.csproj
      - run: ./tests/bin/GitResponsiveness/Debug/net48/GitResponsiveness.exe
      - run: dotnet msbuild Installer/Installer.csproj -target:PreparePortableGit
      - run: dotnet run --project tests/PortableGitTests.csproj -f net8.0 -- Installer/MinGit.props
